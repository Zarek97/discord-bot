<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Generator Drużyn PRO</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
<style>
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: 'Poppins', sans-serif;
    }
    body {
        background-color: #0f172a;
        background-image: 
            radial-gradient(at 0% 0%, hsla(253,16%,7%,1) 0, transparent 50%), 
            radial-gradient(at 50% 0%, hsla(225,39%,30%,1) 0, transparent 50%), 
            radial-gradient(at 100% 0%, hsla(339,49%,30%,1) 0, transparent 50%);
        background-attachment: fixed;
        color: #ffffff;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 25px;
    }
    .app-container {
        background: rgba(255, 255, 255, 0.03);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 24px;
        padding: 35px;
        width: 100%;
        max-width: 1050px;
        box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
    }
    h1 {
        text-align: center;
        margin-bottom: 25px;
        font-size: 2.2rem;
        background: linear-gradient(to right, #38bdf8, #818cf8, #c084fc);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        font-weight: 800;
    }
    .columns-container {
        display: grid;
        grid-template-columns: 1.2fr 1fr;
        gap: 25px;
        margin-bottom: 25px;
    }
    @media (max-width: 850px) {
        .columns-container {
            grid-template-columns: 1fr;
        }
    }
    .panel-box {
        background: rgba(15, 23, 42, 0.45);
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 16px;
        padding: 20px;
        display: flex;
        flex-direction: column;
    }
    .panel-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        padding-bottom: 8px;
    }
    .panel-header h2 {
        font-size: 1.05rem;
        color: #e2e8f0;
        font-weight: 700;
    }
    .quick-actions {
        display: flex;
        gap: 8px;
        margin-bottom: 12px;
    }
    .action-btn {
        background: rgba(255, 255, 255, 0.06);
        border: 1px solid rgba(255, 255, 255, 0.12);
        color: #cbd5e1;
        padding: 6px 12px;
        border-radius: 8px;
        font-size: 0.8rem;
        font-weight: 600;
        cursor: pointer;
        transition: 0.2s;
    }
    .action-btn:hover {
        background: rgba(255, 255, 255, 0.15);
        color: #ffffff;
    }
    .gracze-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
        gap: 8px;
        max-height: 380px;
        overflow-y: auto;
        padding-right: 5px;
    }
    .voice-channels-list {
        display: flex;
        flex-direction: column;
        gap: 12px;
        max-height: 420px;
        overflow-y: auto;
        padding-right: 5px;
    }
    .voice-card {
        background: rgba(255, 255, 255, 0.03);
        border: 1px solid rgba(255, 255, 255, 0.07);
        border-radius: 10px;
        padding: 12px;
    }
    .voice-card-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 8px;
    }
    .voice-card-title {
        font-size: 0.9rem;
        color: #4ade80;
        font-weight: 700;
        display: flex;
        align-items: center;
        gap: 6px;
    }
    .channel-select-btn {
        background: rgba(74, 222, 128, 0.1);
        border: 1px solid rgba(74, 222, 128, 0.3);
        color: #4ade80;
        padding: 4px 8px;
        border-radius: 6px;
        font-size: 0.75rem;
        font-weight: 600;
        cursor: pointer;
        transition: 0.2s;
    }
    .channel-select-btn:hover {
        background: rgba(74, 222, 128, 0.2);
    }
    .gracz-btn {
        background: rgba(255, 255, 255, 0.04);
        border: 1px solid rgba(255, 255, 255, 0.08);
        padding: 8px 10px;
        border-radius: 8px;
        color: rgba(255, 255, 255, 0.6);
        cursor: pointer;
        transition: 0.2s;
        text-align: center;
        user-select: none;
        font-size: 0.85rem;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
    }
    .gracz-btn:hover {
        background: rgba(255, 255, 255, 0.1);
        color: #ffffff;
    }
    .gracz-btn.active {
        background: rgba(56, 189, 248, 0.25);
        border-color: #38bdf8;
        color: #ffffff;
        box-shadow: 0 0 10px rgba(56, 189, 248, 0.25);
        font-weight: 600;
    }
    .control-panel {
        display: flex;
        flex-direction: column;
        gap: 15px;
    }
    .counter-bar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 5px;
    }
    .counter {
        font-size: 0.95rem;
        color: #38bdf8;
        font-weight: 700;
    }
    input[type="number"] {
        width: 100%;
        background: rgba(15, 23, 42, 0.6);
        border: 1px solid rgba(255, 255, 255, 0.15);
        border-radius: 12px;
        padding: 13px;
        color: #fff;
        font-size: 1rem;
        transition: 0.3s;
        outline: none;
    }
    input[type="number"]:focus {
        border-color: #818cf8;
        box-shadow: 0 0 15px rgba(129, 140, 248, 0.3);
    }
    button.losuj-btn {
        width: 100%;
        padding: 16px;
        background: linear-gradient(135deg, #6366f1, #a855f7, #ec4899);
        background-size: 200% 200%;
        color: white;
        border: none;
        border-radius: 12px;
        font-size: 1.15rem;
        font-weight: 800;
        cursor: pointer;
        transition: 0.4s;
        text-transform: uppercase;
        letter-spacing: 2px;
    }
    button.losuj-btn:hover {
        background-position: right center;
        transform: translateY(-2px);
        box-shadow: 0 10px 25px -5px rgba(168, 85, 247, 0.5);
    }
    #wynik {
        margin-top: 25px;
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        gap: 15px;
    }
    .druzyna-karta {
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 14px;
        padding: 18px;
        animation: fadeUp 0.4s ease-out forwards;
        opacity: 0;
        transform: translateY(15px);
    }
    .druzyna-tytul {
        font-size: 1.15rem;
        font-weight: 800;
        color: #38bdf8;
        margin-bottom: 12px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        padding-bottom: 8px;
    }
    .czlonek {
        padding: 6px 0;
        font-size: 0.95rem;
        color: #f1f5f9;
        display: flex;
        align-items: center;
    }
    .czlonek::before {
        content: "•";
        color: #a855f7;
        font-weight: bold;
        display: inline-block;
        width: 1em;
        margin-right: 5px;
    }
    .info-msg {
        color: rgba(255, 255, 255, 0.4);
        font-size: 0.85rem;
        text-align: center;
        padding: 20px 0;
    }
    .error-msg {
        color: #ef4444;
        background: rgba(239, 68, 68, 0.1);
        padding: 12px;
        border-radius: 8px;
        margin-top: 15px;
        text-align: center;
        font-weight: 600;
        border: 1px solid rgba(239, 68, 68, 0.2);
    }
    @keyframes fadeUp {
        to {
            opacity: 1;
            transform: translateY(0);
        }
    }
    ::-webkit-scrollbar {
        width: 6px;
    }
    ::-webkit-scrollbar-track {
        background: rgba(0, 0, 0, 0.1);
        border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb {
        background: rgba(255, 255, 255, 0.2);
        border-radius: 4px;
    }
</style>
</head>
<body>
<div class="app-container">
    <h1>Generator Drużyn</h1>
    
    <div class="columns-container">
        <div class="panel-box">
            <div class="panel-header">
                <h2>Rola: League of Legends</h2>
            </div>
            <div class="quick-actions">
                <button type="button" class="action-btn" onclick="zaznaczWszystkichLol()">Zaznacz wszystkich</button>
                <button type="button" class="action-btn" onclick="odznaczWszystkichLol()">Odznacz</button>
            </div>
            <div id="lista-lol" class="gracze-grid">Ładowanie graczy...</div>
        </div>

        <div class="panel-box">
            <div class="panel-header">
                <h2>Aktywne kanały głosowe</h2>
            </div>
            <div id="lista-glosowe" class="voice-channels-list">Ładowanie kanałów...</div>
        </div>
    </div>

    <div class="control-panel">
        <div class="counter-bar">
            <label for="liczba" style="font-weight:600; color:#cbd5e1;">Liczba drużyn:</label>
            <span id="counter" class="counter">Wybrano łącznie: 0 osób</span>
        </div>
        <input type="number" id="liczba" min="1" placeholder="Np. 2">
        <button class="losuj-btn" onclick="losuj()">Losuj drużyny</button>
    </div>
    
    <div id="wynik"></div>
</div>

<script>
    let graczeLolData = [];
    let kanalyGlosoweData = [];
    let wybraniGracze = new Set();

    function pobierzDane() {
        fetch('/api/dane')
            .then(res => res.json())
            .then(data => {
                if (data.ready === false) {
                    setTimeout(pobierzDane, 1500);
                    return;
                }
                graczeLolData = data.lol_gracze || [];
                kanalyGlosoweData = data.kanaly_glosowe || [];
                renderujWszystko();
            })
            .catch(() => {
                document.getElementById('lista-lol').innerHTML = '<div class="error-msg">Błąd pobierania danych.</div>';
                document.getElementById('lista-glosowe').innerHTML = '<div class="error-msg">Błąd pobierania danych.</div>';
            });
    }

    function renderujWszystko() {
        renderujLol();
        renderujGlosowe();
        aktualizujLicznik();
    }

    function renderujLol() {
        const grid = document.getElementById('lista-lol');
        grid.innerHTML = '';
        if (graczeLolData.length === 0) {
            grid.innerHTML = '<div class="info-msg">Brak osób z rolą League of Legends.</div>';
            return;
        }

        graczeLolData.forEach(gracz => {
            const btn = document.createElement('div');
            btn.className = 'gracz-btn' + (wybraniGracze.has(gracz.name) ? ' active' : '');
            btn.textContent = gracz.name;
            btn.onclick = () => toggleGracz(gracz.name);
            grid.appendChild(btn);
        });
    }

    function renderujGlosowe() {
        const container = document.getElementById('lista-glosowe');
        container.innerHTML = '';
        if (kanalyGlosoweData.length === 0) {
            container.innerHTML = '<div class="info-msg">Nikt aktualnie nie przebywa na kanałach głosowych.</div>';
            return;
        }

        kanalyGlosoweData.forEach(kanal => {
            const card = document.createElement('div');
            card.className = 'voice-card';

            const header = document.createElement('div');
            header.className = 'voice-card-header';

            const title = document.createElement('div');
            title.className = 'voice-card-title';
            title.innerHTML = `🔊 ${kanal.nazwa}`;

            const addAllBtn = document.createElement('button');
            addAllBtn.className = 'channel-select-btn';
            addAllBtn.textContent = '+ Cały kanał';
            addAllBtn.onclick = () => {
                kanal.gracze.forEach(g => wybraniGracze.add(g.name));
                renderujWszystko();
            };

            header.appendChild(title);
            header.appendChild(addAllBtn);
            card.appendChild(header);

            const grid = document.createElement('div');
            grid.className = 'gracze-grid';
            grid.style.maxHeight = 'none';

            kanal.gracze.forEach(gracz => {
                const btn = document.createElement('div');
                btn.className = 'gracz-btn' + (wybraniGracze.has(gracz.name) ? ' active' : '');
                btn.textContent = gracz.name;
                btn.onclick = () => toggleGracz(gracz.name);
                grid.appendChild(btn);
            });

            card.appendChild(grid);
            container.appendChild(card);
        });
    }

    function toggleGracz(nazwa) {
        if (wybraniGracze.has(nazwa)) {
            wybraniGracze.delete(nazwa);
        } else {
            wybraniGracze.add(nazwa);
        }
        renderujWszystko();
    }

    function zaznaczWszystkichLol() {
        graczeLolData.forEach(g => wybraniGracze.add(g.name));
        renderujWszystko();
    }

    function odznaczWszystkichLol() {
        graczeLolData.forEach(g => wybraniGracze.delete(g.name));
        renderujWszystko();
    }

    function aktualizujLicznik() {
        document.getElementById('counter').textContent = `Wybrano łącznie: ${wybraniGracze.size} osób`;
    }

    function losuj() {
        const wynikDiv = document.getElementById('wynik');
        wynikDiv.innerHTML = '';
        
        let osoby = Array.from(wybraniGracze);
        
        if (osoby.length === 0) {
            pokazBlad('Wybierz przynajmniej jedną osobę do losowania.');
            return;
        }
        
        const liczbaInput = document.getElementById('liczba').value;
        const liczbaDruzyn = parseInt(liczbaInput);
        
        if (isNaN(liczbaDruzyn) || liczbaDruzyn < 1) {
            pokazBlad('Wprowadź poprawną liczbę drużyn.');
            return;
        }
        
        if (liczbaDruzyn > osoby.length) {
            pokazBlad('Liczba drużyn nie może być większa niż liczba zaznaczonych osób.');
            return;
        }
        
        for (let i = osoby.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [osoby[i], osoby[j]] = [osoby[j], osoby[i]];
        }
        
        const druzyny = Array.from({ length: liczbaDruzyn }, () => []);
        
        osoby.forEach((osoba, index) => {
            druzyny[index % liczbaDruzyn].push(osoba);
        });
        
        druzyny.forEach((druzyna, i) => {
            const karta = document.createElement('div');
            karta.className = 'druzyna-karta';
            karta.style.animationDelay = `${i * 0.1}s`;
            
            const tytul = document.createElement('div');
            tytul.className = 'druzyna-tytul';
            tytul.textContent = `Drużyna ${i + 1}`;
            karta.appendChild(tytul);
            
            druzyna.forEach(czlonek => {
                const element = document.createElement('div');
                element.className = 'czlonek';
                element.textContent = czlonek;
                karta.appendChild(element);
            });
            
            wynikDiv.appendChild(karta);
        });
    }

    function pokazBlad(wiadomosc) {
        const wynikDiv = document.getElementById('wynik');
        const blad = document.createElement('div');
        blad.className = 'error-msg';
        blad.textContent = wiadomosc;
        wynikDiv.appendChild(blad);
    }

    pobierzDane();
</script>
</body>
</html>
