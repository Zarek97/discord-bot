<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Generator Drużyn PRO</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: 'Poppins', sans-serif;
    }
    body {
        background-color: #0b0f19;
        background-image: 
            radial-gradient(at 0% 0%, hsla(253,16%,10%,1) 0, transparent 50%), 
            radial-gradient(at 50% 0%, hsla(225,39%,18%,1) 0, transparent 50%), 
            radial-gradient(at 100% 0%, hsla(339,49%,18%,1) 0, transparent 50%);
        background-attachment: fixed;
        color: #ffffff;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 20px;
    }
    .app-container {
        background: rgba(255, 255, 255, 0.03);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 20px;
        padding: 25px 30px;
        width: 100%;
        max-width: 1150px;
        box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.6);
    }
    .header-bar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 20px;
    }
    h1 {
        font-size: 2.1rem;
        background: linear-gradient(to right, #38bdf8, #818cf8, #c084fc);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        font-weight: 800;
    }
    .refresh-btn {
        background: rgba(56, 189, 248, 0.1);
        border: 1px solid rgba(56, 189, 248, 0.3);
        color: #38bdf8;
        padding: 8px 14px;
        border-radius: 8px;
        font-size: 0.85rem;
        font-weight: 600;
        cursor: pointer;
        transition: 0.2s;
    }
    .refresh-btn:hover {
        background: rgba(56, 189, 248, 0.2);
    }
    .columns-container {
        display: grid;
        grid-template-columns: 1.35fr 1fr;
        gap: 20px;
        margin-bottom: 20px;
    }
    @media (max-width: 900px) {
        .columns-container {
            grid-template-columns: 1fr;
        }
    }
    .panel-box {
        background: rgba(15, 23, 42, 0.55);
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 14px;
        padding: 18px;
        display: flex;
        flex-direction: column;
    }
    .panel-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        padding-bottom: 10px;
    }
    .panel-header h2 {
        font-size: 1.05rem;
        color: #e2e8f0;
        font-weight: 700;
    }
    .quick-actions {
        display: flex;
        gap: 8px;
        margin-bottom: 12px;
    }
    .search-input {
        width: 100%;
        background: rgba(15, 23, 42, 0.7);
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 8px;
        padding: 9px 12px;
        color: #fff;
        font-size: 0.85rem;
        margin-bottom: 12px;
        outline: none;
    }
    .search-input:focus {
        border-color: #818cf8;
    }
    .action-btn {
        background: rgba(255, 255, 255, 0.06);
        border: 1px solid rgba(255, 255, 255, 0.12);
        color: #cbd5e1;
        padding: 6px 12px;
        border-radius: 7px;
        font-size: 0.8rem;
        font-weight: 600;
        cursor: pointer;
        transition: 0.2s;
    }
    .action-btn:hover {
        background: rgba(255, 255, 255, 0.15);
        color: #ffffff;
    }
    .gracze-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(135px, 1fr));
        gap: 8px;
        max-height: 420px;
        overflow-y: auto;
        padding-right: 6px;
    }
    .gracz-btn {
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid rgba(255, 255, 255, 0.1);
        padding: 10px 10px;
        border-radius: 8px;
        color: #cbd5e1;
        cursor: pointer;
        transition: all 0.15s ease;
        text-align: center;
        user-select: none;
        font-size: 0.84rem;
        font-weight: 500;
        line-height: 1.35;
        min-height: 44px;
        display: flex;
        align-items: center;
        justify-content: center;
        word-break: break-word;
    }
    .gracz-btn:hover {
        background: rgba(255, 255, 255, 0.12);
        color: #ffffff;
        border-color: rgba(255, 255, 255, 0.2);
    }
    .gracz-btn.active {
        background: rgba(56, 189, 248, 0.25);
        border-color: #38bdf8;
        color: #38bdf8;
        box-shadow: 0 0 10px rgba(56, 189, 248, 0.3);
        font-weight: 700;
    }
    .voice-channels-list {
        display: flex;
        flex-direction: column;
        gap: 12px;
        max-height: 470px;
        overflow-y: auto;
        padding-right: 6px;
    }
    .voice-card {
        background: rgba(255, 255, 255, 0.02);
        border: 1px solid rgba(255, 255, 255, 0.07);
        border-radius: 10px;
        padding: 12px;
    }
    .voice-card-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 10px;
    }
    .voice-card-title {
        font-size: 0.88rem;
        color: #4ade80;
        font-weight: 700;
        display: flex;
        align-items: center;
        gap: 6px;
    }
    .channel-select-btn {
        background: rgba(74, 222, 128, 0.12);
        border: 1px solid rgba(74, 222, 128, 0.35);
        color: #4ade80;
        padding: 4px 8px;
        border-radius: 6px;
        font-size: 0.75rem;
        font-weight: 600;
        cursor: pointer;
        transition: 0.2s;
    }
    .channel-select-btn:hover {
        background: rgba(74, 222, 128, 0.22);
    }
    .control-panel {
        display: flex;
        flex-direction: column;
        gap: 12px;
    }
    .counter-bar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }
    .counter {
        font-size: 0.95rem;
        color: #38bdf8;
        font-weight: 700;
    }
    input[type="number"] {
        width: 100%;
        background: rgba(15, 23, 42, 0.6);
        border: 1px solid rgba(255, 255, 255, 0.15);
        border-radius: 10px;
        padding: 12px 14px;
        color: #fff;
        font-size: 0.95rem;
        outline: none;
        transition: 0.2s;
    }
    input[type="number"]:focus {
        border-color: #818cf8;
        box-shadow: 0 0 10px rgba(129, 140, 248, 0.3);
    }
    button.losuj-btn {
        width: 100%;
        padding: 15px;
        background: linear-gradient(135deg, #6366f1, #a855f7, #ec4899);
        background-size: 200% 200%;
        color: white;
        border: none;
        border-radius: 10px;
        font-size: 1.1rem;
        font-weight: 800;
        cursor: pointer;
        transition: 0.3s;
        text-transform: uppercase;
        letter-spacing: 1.5px;
    }
    button.losuj-btn:hover {
        background-position: right center;
        transform: translateY(-1px);
        box-shadow: 0 8px 20px -4px rgba(168, 85, 247, 0.5);
    }
    #wynik {
        margin-top: 22px;
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
        gap: 14px;
    }
    .druzyna-karta {
        background: rgba(255, 255, 255, 0.04);
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 12px;
        padding: 16px;
        animation: fadeUp 0.3s ease-out forwards;
        opacity: 0;
        transform: translateY(10px);
    }
    .druzyna-tytul {
        font-size: 1.1rem;
        font-weight: 800;
        color: #38bdf8;
        margin-bottom: 10px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        padding-bottom: 6px;
    }
    .czlonek {
        padding: 5px 0;
        font-size: 0.92rem;
        color: #f1f5f9;
        display: flex;
        align-items: center;
    }
    .czlonek::before {
        content: "•";
        color: #a855f7;
        font-weight: bold;
        display: inline-block;
        width: 1em;
        margin-right: 5px;
    }
    .info-msg {
        color: rgba(255, 255, 255, 0.45);
        font-size: 0.85
