<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Generator Drużyn PRO</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
<style>
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: 'Poppins', sans-serif;
    }
    body {
        background-color: #0f172a;
        background-image: 
            radial-gradient(at 0% 0%, hsla(253,16%,7%,1) 0, transparent 50%), 
            radial-gradient(at 50% 0%, hsla(225,39%,30%,1) 0, transparent 50%), 
            radial-gradient(at 100% 0%, hsla(339,49%,30%,1) 0, transparent 50%);
        background-attachment: fixed;
        color: #ffffff;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 20px;
    }
    .app-container {
        background: rgba(255, 255, 255, 0.03);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 24px;
        padding: 35px;
        width: 100%;
        max-width: 820px;
        box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
    }
    h1 {
        text-align: center;
        margin-bottom: 25px;
        font-size: 2.2rem;
        background: linear-gradient(to right, #38bdf8, #818cf8, #c084fc);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        font-weight: 800;
    }
    .input-group {
        margin-bottom: 20px;
    }
    .section-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 10px;
    }
    label {
        font-size: 0.95rem;
        color: #cbd5e1;
        font-weight: 600;
    }
    .counter {
        font-size: 0.85rem;
        color: #38bdf8;
        font-weight: 600;
    }
    .quick-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-bottom: 12px;
    }
    .action-btn {
        background: rgba(255, 255, 255, 0.06);
        border: 1px solid rgba(255, 255, 255, 0.12);
        color: #cbd5e1;
        padding: 7px 13px;
        border-radius: 8px;
        font-size: 0.82rem;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.2s ease;
    }
    .action-btn:hover {
        background: rgba(255, 255, 255, 0.15);
        color: #ffffff;
    }
    .action-btn.voice-btn {
        background: rgba(34, 197, 94, 0.12);
        border-color: rgba(34, 197, 94, 0.35);
        color: #4ade80;
    }
    .action-btn.voice-btn:hover {
        background: rgba(34, 197, 94, 0.22);
    }
    .gracze-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
        gap: 8px;
        max-height: 380px;
        overflow-y: auto;
        padding-right: 6px;
    }
    .gracz-btn {
        background: rgba(255, 255, 255, 0.04);
        border: 1px solid rgba(255, 255, 255, 0.08);
        padding: 9px 10px;
        border-radius: 8px;
        color: rgba(255, 255, 255, 0.5);
        cursor: pointer;
        transition: all 0.2s ease;
        text-align: center;
        user-select: none;
        font-size: 0.88rem;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 5px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
    }
    .gracz-btn:hover {
        background: rgba(255, 255, 255, 0.1);
        color: #ffffff;
    }
    .gracz-btn.active {
        background: rgba(56, 189, 248, 0.25);
        border-color: #38bdf8;
        color: #ffffff;
        box-shadow: 0 0 10px rgba(56, 189, 248, 0.25);
        font-weight: 600;
    }
    .voice-tag {
        font-size: 0.75rem;
        color: #4ade80;
    }
    input[type="number"] {
        width: 100%;
        background: rgba(15, 23, 42, 0.6);
        border: 1px solid rgba(255, 255, 255, 0.15);
        border-radius: 12px;
        padding: 13px;
        color: #fff;
        font-size: 1rem;
        transition: all 0.3s ease;
        outline: none;
    }
    input[type="number"]:focus {
        border-color: #818cf8;
        box-shadow: 0 0 15px rgba(129, 140, 248, 0.3);
    }
    button.losuj-btn {
        width: 100%;
        padding: 15px;
        background: linear-gradient(135deg, #6366f1, #a855f7, #ec4899);
        background-size: 200% 200%;
        color: white;
        border: none;
        border-radius: 12px;
        font-size: 1.15rem;
        font-weight: 800;
        cursor: pointer;
        transition: all 0.4s ease;
        text-transform: uppercase;
        letter-spacing: 2px;
        margin-top: 5px;
    }
    button.losuj-btn:hover {
        background-position: right center;
        transform: translateY(-2px);
        box-shadow: 0 10px 25px -5px rgba(168, 85, 247, 0.5);
    }
    #wynik {
        margin-top: 25px;
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        gap: 15px;
    }
    .druzyna-karta {
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 14px;
        padding: 18px;
        animation: fadeUp 0.4s ease-out forwards;
        opacity: 0;
        transform: translateY(15px);
    }
    .druzyna-tytul {
        font-size: 1.15rem;
        font-weight: 800;
        color: #38bdf8;
        margin-bottom: 12px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        padding-bottom: 8px;
    }
    .czlonek {
        padding: 6px 0;
        font-size: 0.95rem;
        color: #f1f5f9;
        display: flex;
        align-items: center;
    }
    .czlonek::before {
        content: "•";
        color: #a855f7;
        font-weight: bold;
        display: inline-block;
        width: 1em;
        margin-right: 5px;
    }
    .error-msg {
        color: #ef4444;
        background: rgba(239, 68, 68, 0.1);
        padding: 12px;
        border-radius: 8px;
        margin-top: 15px;
        text-align: center;
        font-weight: 600;
        border: 1px solid rgba(239, 68, 68, 0.2);
    }
    @keyframes fadeUp {
        to {
            opacity: 1;
            transform: translateY(0);
        }
    }
    ::-webkit-scrollbar {
        width: 6px;
    }
    ::-webkit-scrollbar-track {
        background: rgba(0, 0, 0, 0.1);
        border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb {
        background: rgba(255, 255, 255, 0.2);
        border-radius: 4px;
    }
</style>
</head>
<body>
<div class="app-container">
    <h1>Generator Drużyn</h1>
    
    <div class="input-group">
        <div class="section-header">
            <label>Wybierz graczy do losowania:</label>
            <span id="counter" class="counter">Wybrano: 0</span>
        </div>
        
        <div class="quick-actions">
            <button type="button" class="action-btn voice-btn" onclick="zaznaczGlosowych()">🔊 Tylko na kanale głosowym</button>
            <button type="button" class="action-btn" onclick="zaznaczWszystkich()">Zaznacz wszystkich</button>
            <button type="button" class="action-btn" onclick="odznaczWszystkich()">Odznacz wszystkich</button>
        </div>
        
        <div id="lista-graczy" class="gracze-grid">Ładowanie graczy z Discorda...</div>
    </div>
    
    <div class="input-group">
        <label for="liczba">Liczba drużyn:</label>
        <input type="number" id="liczba" min="1" placeholder="Np. 2" style="margin-top: 8px;">
    </div>
    
    <button class="losuj-btn" onclick="losuj()">Losuj drużyny</button>
    
    <div id="wynik"></div>
</div>

<script>
    let wszyscyGracze = [];
    let wybraniGracze = new Set();
    
    fetch('/api/gracze')
        .then(response => response.json())
        .then(data => {
            const grid = document.getElementById('lista-graczy');
            grid.innerHTML = '';
            
            if (!Array.isArray(data) || data.length === 0) {
                grid.innerHTML = '<div class="error-msg">Nie znaleziono graczy z tą rolą.</div>';
                return;
            }
            
            wszyscyGracze = data.sort((a, b) => a.name.localeCompare(b.name, 'pl', { sensitivity: 'base' }));
            
            wszyscyGracze.forEach(gracz => {
                const btn = document.createElement('div');
                btn.className = 'gracz-btn';
                btn.dataset.id = gracz.id;
                
                if (gracz.in_voice) {
                    btn.innerHTML = `<span class="voice-tag">🔊</span><span>${gracz.name}</span>`;
                } else {
                    btn.textContent = gracz.name;
                }
                
                btn.onclick = () => {
                    if (wybraniGracze.has(gracz.name)) {
                        wybraniGracze.delete(gracz.name);
                        btn.classList.remove('active');
                    } else {
                        wybraniGracze.add(gracz.name);
                        btn.classList.add('active');
                    }
                    aktualizujLicznik();
                };
                grid.appendChild(btn);
            });
            aktualizujLicznik();
        })
        .catch(error => {
            document.getElementById('lista-graczy').innerHTML = '<div class="error-msg">Błąd pobierania danych.</div>';
        });

    function aktualizujLicznik() {
        document.getElementById('counter').textContent = `Wybrano: ${wybraniGracze.size}`;
    }

    function zaznaczGlosowych() {
        wybraniGracze.clear();
        const przyciski = document.querySelectorAll('.gracz-btn');
        wszyscyGracze.forEach((gracz, index) => {
            const btn = przyciski[index];
            if (gracz.in_voice) {
                wybraniGracze.add(gracz.name);
                btn.classList.add('active');
            } else {
                btn.classList.remove('active');
            }
        });
        aktualizujLicznik();
    }

    function zaznaczWszystkich() {
        wybraniGracze.clear();
        const przyciski = document.querySelectorAll('.gracz-btn');
        wszyscyGracze.forEach((gracz, index) => {
            wybraniGracze.add(gracz.name);
            przyciski[index].classList.add('active');
        });
        aktualizujLicznik();
    }

    function odznaczWszystkich() {
        wybraniGracze.clear();
        document.querySelectorAll('.gracz-btn').forEach(btn => btn.classList.remove('active'));
        aktualizujLicznik();
    }
        
    function losuj() {
        const wynikDiv = document.getElementById('wynik');
        wynikDiv.innerHTML = '';
        
        let osoby = Array.from(wybraniGracze);
        
        if (osoby.length === 0) {
            pokazBlad('Wybierz przynajmniej jedną osobę.');
            return;
        }
        
        const liczbaInput = document.getElementById('liczba').value;
        const liczbaDruzyn = parseInt(liczbaInput);
        
        if (isNaN(liczbaDruzyn) || liczbaDruzyn < 1) {
            pokazBlad('Wprowadź poprawną liczbę drużyn.');
            return;
        }
        
        if (liczbaDruzyn > osoby.length) {
            pokazBlad('Liczba drużyn nie może być większa niż liczba zaznaczonych osób.');
            return;
        }
        
        for (let i = osoby.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [osoby[i], osoby[j]] = [osoby[j], osoby[i]];
        }
        
        const druzyny = Array.from({ length: liczbaDruzyn }, () => []);
        
        osoby.forEach((osoba, index) => {
            druzyny[index % liczbaDruzyn].push(osoba);
        });
        
        druzyny.forEach((druzyna, i) => {
            const karta = document.createElement('div');
            karta.className = 'druzyna-karta';
            karta.style.animationDelay = `${i * 0.1}s`;
            
            const tytul = document.createElement('div');
            tytul.className = 'druzyna-tytul';
            tytul.textContent = `Drużyna ${i + 1}`;
            karta.appendChild(tytul);
            
            druzyna.forEach(czlonek => {
                const element = document.createElement('div');
                element.className = 'czlonek';
                element.textContent = czlonek;
                karta.appendChild(element);
            });
            
            wynikDiv.appendChild(karta);
        });
    }

    function pokazBlad(wiadomosc) {
        const wynikDiv = document.getElementById('wynik');
        const blad = document.createElement('div');
        blad.className = 'error-msg';
        blad.textContent = wiadomosc;
        wynikDiv.appendChild(blad);
    }
</script>
</body>
</html>
